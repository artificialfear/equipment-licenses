<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raven Band Equipment Licenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: inventory-tag system. A dark header band holds the student's ID; licenses are punched equipment tags; study and test views are single reading columns; the certificate is a large tag with a brass stamp. */
:root{
  --paper:#EDEFF2; --surface:#FFFFFF; --ink:#16191F; --muted:#586070; --line:#D2D6DD;
  --brass:#B4832A; --brass-ink:#7A5512; --brass-wash:#F6EBD3;
  --stop:#B83227; --stop-wash:#F8E2DF; --go:#2B7A4B; --go-wash:#DDF0E4;
  --band:#16191F; --band-ink:#EDEFF2;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Verdana,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111318; --surface:#1A1D23; --ink:#E7E9ED; --muted:#9BA2AF; --line:#2D3139;
  --brass:#D4A548; --brass-ink:#E3BC6C; --brass-wash:#33291A;
  --stop:#E46B5D; --stop-wash:#3A201E; --go:#5DBB86; --go-wash:#1A3226;
  --band:#090A0D; --band-ink:#E7E9ED; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111318; --surface:#1A1D23; --ink:#E7E9ED; --muted:#9BA2AF; --line:#2D3139;
  --brass:#D4A548; --brass-ink:#E3BC6C; --brass-wash:#33291A;
  --stop:#E46B5D; --stop-wash:#3A201E; --go:#5DBB86; --go-wash:#1A3226;
  --band:#090A0D; --band-ink:#E7E9ED; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.05;text-wrap:balance;margin:0}
button,input,select{font:inherit}
a{color:var(--brass-ink)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* Header band */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:22px 20px;display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between}
.mast{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--brass)}
.mast h1{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:.01em;text-transform:uppercase}
.idcard{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.band .field label{color:#9BA2AF}
.field input,.field select{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:9px 11px;min-width:0}
.band .field input,.band .field select{background:#22262E;border-color:#3A3F49;color:#EDEFF2}
#studentName{width:min(260px,70vw)}

nav.tabs{display:flex;gap:4px;margin-top:-1px}
nav.tabs button{background:none;border:0;color:var(--muted);padding:12px 4px;margin-right:18px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--brass)}

main{padding-block:26px 64px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#16191F}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Intro + rules strip */
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;margin-bottom:30px}
.intro p{margin:0 0 10px;max-width:62ch}
.rulebox{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:16px 18px}
.rulebox h3{font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.rulebox ul{margin:0;padding-left:18px}
.rulebox li{margin:4px 0}
@media (max-width:720px){.intro{grid-template-columns:1fr}}

/* License tags */
.tags{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:860px){.tags{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.tags{grid-template-columns:1fr}}
.tag{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:6px 22px 22px 6px;padding:18px 18px 16px 46px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:var(--ink);transition:transform .15s ease,border-color .15s ease}
.tag:hover{transform:translateY(-2px);border-color:var(--brass)}
.tag::before{content:"";position:absolute;left:16px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 3px var(--line)}
.tag .tno{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.tag h2{font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.tag p{margin:0;color:var(--muted);font-size:14.5px}
.tag .foot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.pill.req{border-color:var(--brass);color:var(--brass-ink);background:var(--brass-wash)}
.pill.pass{border-color:var(--go);color:var(--go);background:var(--go-wash)}
.tag.passed{border-color:var(--go)}
.tag.passed::before{box-shadow:inset 0 0 0 3px var(--go)}
.meta{font-size:13px;color:var(--muted)}

/* Study view */
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:14px;font-weight:700}
.back:hover{color:var(--ink)}
.lichead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin-bottom:6px}
.lichead h2{font-size:clamp(32px,5vw,44px);text-transform:uppercase;font-weight:800}
.lead{color:var(--muted);max-width:64ch;margin:0 0 22px}
.study{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
@media (max-width:760px){.study{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:2px;font-size:14px}
.toc a{color:var(--muted);text-decoration:none;padding:5px 0 5px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);border-left-color:var(--brass)}
.sec{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line);max-width:68ch}
.sec h3{font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
.sec p{margin:0 0 10px}
.sec ul{margin:0 0 10px;padding-left:20px}
.sec li{margin:5px 0}
.crit{border:1.5px solid var(--stop);background:var(--stop-wash);border-radius:6px;padding:10px 14px;margin:10px 0}
.crit b:first-child{color:var(--stop);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:15px;display:block}
.tablewrap{overflow-x:auto;margin:6px 0 12px}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.no{color:var(--stop)}
.ack{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-width:68ch}
.ack label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ack input{width:20px;height:20px;margin-top:2px;accent-color:var(--brass)}
.warn{color:var(--stop);font-weight:700;font-size:14px;margin:0}

/* Test */
.testhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:18px}
.q{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:16px 18px;margin:0 0 14px;max-width:72ch}
.q legend{font-weight:700;padding:0;display:flex;gap:10px;float:left;width:100%;margin-bottom:10px}
.q legend .n{font-family:var(--f-mono);color:var(--muted);font-weight:500;flex:none}
.q .opts{clear:both;display:flex;flex-direction:column;gap:6px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;border:1.5px solid transparent;cursor:pointer}
.q label:hover{background:var(--paper)}
.q input{margin-top:4px;accent-color:var(--brass);width:18px;height:18px;flex:none}
.q input:checked + span{font-weight:700}
.q.unanswered{border-color:var(--stop)}
.star{color:var(--stop);font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:13px;text-transform:uppercase;white-space:nowrap}

/* Result */
.result{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:20px 22px;max-width:72ch;margin-bottom:18px}
.result.fail{border-color:var(--stop)}
.result h2{font-size:38px;text-transform:uppercase;font-weight:800}
.result.fail h2{color:var(--stop)}
.scoreline{display:flex;flex-wrap:wrap;gap:10px 28px;margin:12px 0;font-variant-numeric:tabular-nums}
.scoreline div{display:flex;flex-direction:column}
.scoreline b{font-family:var(--f-display);font-size:30px;line-height:1}
.scoreline span{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.missed{max-width:72ch}
.missed .m{border-left:3px solid var(--stop);padding:6px 0 6px 14px;margin:0 0 12px}
.missed .m p{margin:2px 0}

/* Certificate */
.cert{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:8px 40px 40px 8px;padding:28px 28px 24px 74px;max-width:760px;overflow:hidden}
.cert::before{content:"";position:absolute;left:26px;top:34px;width:24px;height:24px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 4px var(--brass)}
.cert .eyebrow{color:var(--brass-ink)}
.cert h2{font-size:clamp(30px,5vw,46px);text-transform:uppercase;font-weight:800;margin:4px 0 2px}
.stamp{position:absolute;right:24px;top:22px;transform:rotate(-8deg);border:3px solid var(--go);color:var(--go);font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.12em;padding:4px 12px;border-radius:6px;text-transform:uppercase}
@media (max-width:560px){.stamp{position:static;display:inline-block;margin-bottom:10px}.cert{padding-left:58px}.cert::before{left:18px}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 22px;margin:18px 0}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.kv b{font-size:18px;overflow-wrap:anywhere}
.code{font-family:var(--f-mono);font-size:24px;letter-spacing:.08em;color:var(--brass-ink)}
.practical{border-top:2px dashed var(--line);padding-top:14px;margin-top:6px}
.practical h3{font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.practical p{margin:0 0 8px;color:var(--muted);font-size:14px}
.practical ol{margin:0;padding-left:22px}
.practical li{display:list-item;margin:6px 0}
.practical li .ini{display:inline-block;margin-left:8px;color:var(--muted);font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.next{max-width:760px;margin-top:16px;border:1.5px solid var(--brass);background:var(--brass-wash);border-radius:8px;padding:14px 18px}
.next p{margin:0 0 6px}

/* Director */
.dir{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
@media (max-width:760px){.dir{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:18px 20px}
.panel h3{font-size:24px;text-transform:uppercase;margin-bottom:10px}
.panel .field{margin-bottom:10px}
.panel .field input,.panel .field select{width:100%}
.verdict{margin-top:12px;padding:10px 14px;border-radius:6px;font-weight:700}
.verdict.ok{background:var(--go-wash);color:var(--go)}
.verdict.bad{background:var(--stop-wash);color:var(--stop)}
.panel ul{padding-left:18px;margin:0}
.panel li{margin:6px 0}
.small{font-size:14px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div class="mast">
      <span class="eyebrow">Raven Band · STEM Academy @ Bartlett</span>
      <h1>Equipment Licenses</h1>
    </div>
    <div class="idcard">
      <div class="field"><label for="studentName">First &amp; last name</label><input id="studentName" autocomplete="name" placeholder="e.g. Jordan Smith"></div>
      <div class="field"><label for="studentBlock">Block</label>
        <select id="studentBlock"><option value="">Pick</option><option>1st</option><option>3rd</option><option>4th</option><option>6th</option><option>7th</option></select>
      </div>
    </div>
  </div>
</header>
<div class="wrap">
  <nav class="tabs" aria-label="Sections">
    <button id="tabStudent" aria-current="true">Licenses</button>
    <button id="tabDirector" aria-current="false">Director</button>
  </nav>
</div>
<main class="wrap" id="app"></main>

/* ============================================================
   SETTINGS
   ============================================================ */
const PASS_PCT = 80;      // overall score needed
const DRAW = 10;          // questions per test (or full bank if smaller)
const SALT = "RB-H1O8OJO21P"; // change to invalidate old codes

/* ============================================================
   STORAGE (per-device convenience only)
   ============================================================ */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm = n => String(n).toLowerCase().replace(/[^a-z]/g,"");
const today = () => {const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const prettyDate = iso => {const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})};
function fnv(str,seed){let h=seed>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function b32(n){let s="";for(let i=0;i<4;i++){s=B32[n%32]+s;n=Math.floor(n/32)}return s}
function makeCode(name,licId,date){const s=norm(name)+"|"+licId+"|"+date+"|"+SALT;return b32(fnv(s,2166136261))+"-"+b32(fnv(s,0x9747b28c))}
const lic = id => LICENSES.find(l=>l.id===id);
const qCount = l => Math.min(l.draw||DRAW,l.bank.length);

function student(){return {name:$("#studentName").value.trim(),block:$("#studentBlock").value}}
function myPasses(){const k=norm(student().name);return k?(store.get("rbl_passes",{})[k]||{}):{}}

/* ============================================================
   VIEWS
   ============================================================ */
let current = {view:"home"};

function go(v){current=v;render();window.scrollTo(0,0)}

function render(){
  $("#tabStudent").setAttribute("aria-current",current.view==="director"?"false":"true");
  $("#tabDirector").setAttribute("aria-current",current.view==="director"?"true":"false");
  const app=$("#app");
  if(current.view==="home") app.innerHTML=homeHTML();
  else if(current.view==="study") app.innerHTML=studyHTML(lic(current.id));
  else if(current.view==="test") app.innerHTML=testHTML(lic(current.id));
  else if(current.view==="result") app.innerHTML=resultHTML();
  else if(current.view==="cert") app.innerHTML=certHTML(current.id);
  else if(current.view==="director") app.innerHTML=directorHTML();
  bind();
}

function homeHTML(){
  const passes=myPasses();
  return `<section class="intro">
    <div>
      <p><b>Using school equipment is a privilege you earn.</b> Each license below covers one area of the band room. Study the rules, then pass the test to earn that license.</p>
      <p>Your license is complete after Mr. Graham signs your hands-on check-off. Until then, you can't use equipment in that area.</p>
    </div>
    <div class="rulebox"><h3>To pass a test</h3><ul>
      <li>Score at least ${PASS_PCT}% overall.</li>
      <li>Get every <span class="star">Critical</span> question right. Missing even one means a retake.</li>
      <li>You can retake as many times as you need. Questions and answers change order each time.</li>
    </ul></div>
  </section>
  <div class="tags">${LICENSES.map(l=>{
    const p=passes[l.id];
    return `<button class="tag${p?" passed":""}" data-open="${l.id}">
      <span class="tno">${l.tag}</span>
      <h2>${esc(l.name)}</h2>
      <p>${esc(l.blurb)}</p>
      <span class="foot">${p?`<span class="pill pass">Written test passed</span><span class="meta">${prettyDate(p.date)}</span>`:(l.req?`<span class="pill req">Required first</span>`:`<span class="pill">Not passed</span>`)}<span class="meta">${qCount(l)} questions</span></span>
    </button>`}).join("")}</div>`;
}

function studyHTML(l){
  const passes=myPasses();
  const missingReq = l.req ? [] : LICENSES.filter(x=>x.req && !passes[x.id]).map(x=>x.name);
  return `<button class="back" data-home>← All licenses</button>
  <div class="lichead"><h2>${esc(l.name)}</h2><span class="tno meta" style="font-family:var(--f-mono)">${l.tag}</span></div>
  <p class="lead">${esc(l.lead)}</p>
  <div class="study">
    <nav class="toc" aria-label="Sections">${l.sections.map((s,i)=>`<a href="#s${i}" data-jump="s${i}">${esc(s.h)}</a>`).join("")}<a href="#ack" data-jump="ack">Take the test</a></nav>
    <div>
      ${l.sections.map((s,i)=>`<section class="sec" id="s${i}"><h3>${esc(s.h)}</h3>${s.html}</section>`).join("")}
      <section class="sec" id="handsOn"><h3>Hands-on check-off</h3><p>After you pass the test, you'll show Mr. Graham you can do these in person:</p><ul>${l.practical.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></section>
      <div class="ack" id="ack">
        ${missingReq.length?`<p class="warn">${missingReq.join(" and ")} ${missingReq.length>1?"come":"comes"} first. Mr. Graham will not sign this license until ${missingReq.length>1?"both are":"that is"} complete.</p>`:""}
        <label><input type="checkbox" id="readAll"><span>I read every section on this page and I understand the critical rules.</span></label>
        <p class="warn" id="nameWarn" hidden>Enter your first and last name and your block at the top of the page first.</p>
        <div class="row"><button class="btn brass" id="startTest" disabled>Start the test</button><span class="meta">${qCount(l)} questions · ${l.bank.filter(q=>q.crit).length} critical</span></div>
      </div>
    </div>
  </div>`;
}

function buildTest(l){
  const crit=l.bank.filter(q=>q.crit), rest=shuffle(l.bank.filter(q=>!q.crit));
  const n=qCount(l);
  const picked=shuffle(crit.concat(rest.slice(0,Math.max(0,n-crit.length))));
  return picked.map(q=>{
    const opts=shuffle(q.opts.map((t,i)=>({t,ok:i===0})));
    return {q:q.q,crit:!!q.crit,why:q.why,opts};
  });
}

function testHTML(l){
  const t=current.test;
  const s=student();
  return `<button class="back" data-study="${l.id}">← Back to study</button>
  <div class="testhead"><div class="lichead" style="margin:0"><h2>${esc(l.name)} test</h2></div><span class="meta">${esc(s.name)} · ${esc(s.block)} Block</span></div>
  <form id="testForm" novalidate>
    ${t.map((q,i)=>`<fieldset class="q" id="q${i}"><legend><span class="n">${String(i+1).padStart(2,"0")}</span><span>${esc(q.q)}${q.crit?` <span class="star">· Critical</span>`:""}</span></legend>
      <div class="opts">${q.opts.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" id="q${i}o${j}"><span>${esc(o.t)}</span></label>`).join("")}</div>
    </fieldset>`).join("")}
    <p class="warn" id="incomplete" hidden>Answer every question before you submit. Unanswered questions are outlined in red.</p>
    <button class="btn brass" type="submit">Submit test</button>
  </form>`;
}

function resultHTML(){
  const r=current.result, l=lic(current.id);
  const pct=Math.round(r.correct/r.total*100);
  if(r.pass){return ""}
  return `<button class="back" data-home>← All licenses</button>
  <div class="result fail">
    <span class="eyebrow" style="color:var(--stop)">${esc(l.name)}</span>
    <h2>Not yet</h2>
    <div class="scoreline">
      <div><b>${pct}%</b><span>Score (need ${PASS_PCT}%)</span></div>
      <div><b>${r.critCorrect}/${r.critTotal}</b><span>Critical correct (need all)</span></div>
    </div>
    <p>${!r.critOk?"You missed at least one critical rule. Those protect the most expensive and fragile equipment, so they have to be perfect.":"You got every critical rule, but your overall score is under "+PASS_PCT+"%."} Review the rules below, then go back and study before you retake.</p>
  </div>
  <div class="missed"><h3 style="font-size:22px;text-transform:uppercase;margin-bottom:10px">Rules to review</h3>
    ${r.missed.map(m=>`<div class="m"><p><b>${esc(m.q)}</b>${m.crit?` <span class="star">· Critical</span>`:""}</p><p>${esc(m.why)}</p></div>`).join("")}
  </div>
  <div class="row" style="margin-top:16px"><button class="btn brass" data-study="${l.id}">Study again</button><button class="btn ghost" data-home>All licenses</button></div>`;
}

function certHTML(id){
  const l=lic(id), p=myPasses()[id];
  if(!p) return homeHTML();
  return `<button class="back" data-home>← All licenses</button>
  <article class="cert" aria-label="License certificate">
    <span class="stamp">Written passed</span>
    <span class="eyebrow">Raven Band Equipment License · ${l.tag}</span>
    <h2>${esc(l.name)}</h2>
    <div class="kv">
      <div><span>Student</span><b>${esc(p.name)}</b></div>
      <div><span>Block</span><b>${esc(p.block)}</b></div>
      <div><span>Date</span><b>${prettyDate(p.date)}</b></div>
      <div><span>Score</span><b>${p.score}% · all critical</b></div>
    </div>
    <div class="kv" style="margin-top:0"><div><span>Verification code</span><b class="code">${p.code}</b></div></div>
    <div class="practical">
      <h3>Hands-on check-off</h3>
      <p>Not active until Mr. Graham initials every line.</p>
      <ol>${l.practical.map(x=>`<li>${esc(x)}<span class="ini">Initials ______</span></li>`).join("")}</ol>
    </div>
  </article>
  <div class="next">
    <p><b>Next steps</b></p>
    <p>1. Take a screenshot of this license and upload it to the Brightspace assignment.</p>
    <p>2. Show Mr. Graham for your hands-on check-off. You can use equipment in this area after he signs off.</p>
  </div>`;
}

function directorHTML(){
  return `<div class="dir">
    <section class="panel">
      <h3>Verify a license</h3>
      <p class="small">Enter what's on the student's screenshot. A code only matches the exact name, license, and date it was earned with.</p>
      <div class="field"><label for="vName">Student name</label><input id="vName" placeholder="As shown on the license"></div>
      <div class="field"><label for="vLic">License</label><select id="vLic">${LICENSES.map(l=>`<option value="${l.id}">${l.tag} · ${esc(l.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="vDate">Date earned</label><input id="vDate" type="date" value="${today()}"></div>
      <div class="field"><label for="vCode">Verification code</label><input id="vCode" placeholder="XXXX-XXXX" style="font-family:var(--f-mono);text-transform:uppercase"></div>
      <button class="btn" id="verifyBtn">Check code</button>
      <div id="verdict" aria-live="polite"></div>
    </section>
    <section class="panel">
      <h3>How licensing works</h3>
      <ul>
        <li>Band Room Basics and Band Room Procedures are both required before any instrument license.</li>
        <li>Pass rule: ${PASS_PCT}% overall and 100% on critical questions. Unlimited retakes; question and answer order reshuffle each time.</li>
        <li>A passed written test is not a license by itself. The license activates when you initial the hands-on check-off.</li>
        <li>Names are matched ignoring capitals, spaces, and punctuation.</li>
        <li>Pass records on this page are saved only on the student's device. Your official record is the Brightspace screenshot and your signed check-off.</li>
      </ul>
      <h3 style="margin-top:18px">Licenses</h3>
      <ul>${LICENSES.map(l=>`<li><b>${l.tag}</b> ${esc(l.name)}: ${l.bank.length} questions in bank, ${l.bank.filter(q=>q.crit).length} critical</li>`).join("")}</ul>
    </section>
  </div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function bind(){
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.open, p=myPasses()[id];
    go(p?{view:"cert",id}:{view:"study",id});
  });
  document.querySelectorAll("[data-home]").forEach(b=>b.onclick=()=>go({view:"home"}));
  document.querySelectorAll("[data-study]").forEach(b=>b.onclick=()=>go({view:"study",id:b.dataset.study}));
  document.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById(a.dataset.jump);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});

  const cb=$("#readAll"), st=$("#startTest");
  if(cb&&st){
    cb.onchange=()=>{st.disabled=!cb.checked};
    st.onclick=()=>{
      const s=student();
      if(!s.name||s.name.split(/\s+/).length<2||!s.block){$("#nameWarn").hidden=false;$("#studentName").focus();return}
      const l=lic(current.id);
      go({view:"test",id:l.id,test:buildTest(l)});
    };
  }

  const f=$("#testForm");
  if(f){f.onsubmit=e=>{
    e.preventDefault();
    const t=current.test; let missing=0;
    t.forEach((q,i)=>{const el=document.getElementById("q"+i);const sel=f.querySelector(`input[name="q${i}"]:checked`);el.classList.toggle("unanswered",!sel);if(!sel)missing++;q.pick=sel?Number(sel.value):null});
    if(missing){$("#incomplete").hidden=false;document.querySelector(".q.unanswered").scrollIntoView({behavior:"smooth",block:"center"});return}
    const r={total:t.length,correct:0,critTotal:0,critCorrect:0,missed:[]};
    t.forEach(q=>{const ok=q.opts[q.pick].ok;if(ok)r.correct++;if(q.crit){r.critTotal++;if(ok)r.critCorrect++}if(!ok)r.missed.push(q)});
    r.critOk=r.critCorrect===r.critTotal;
    const pct=Math.round(r.correct/r.total*100);
    r.pass=r.critOk&&pct>=PASS_PCT;
    if(r.pass){
      const s=student(), date=today();
      const all=store.get("rbl_passes",{}), k=norm(s.name);
      all[k]=all[k]||{};
      all[k][current.id]={name:s.name,block:s.block,date,score:pct,code:makeCode(s.name,current.id,date)};
      store.set("rbl_passes",all);
      go({view:"cert",id:current.id});
    } else go({view:"result",id:current.id,result:r});
  }}

  const vb=$("#verifyBtn");
  if(vb){vb.onclick=()=>{
    const name=$("#vName").value, id=$("#vLic").value, date=$("#vDate").value, code=$("#vCode").value.toUpperCase().replace(/[^0-9A-Z]/g,"");
    const out=$("#verdict");
    if(!name||!date||!code){out.className="verdict bad";out.textContent="Fill in the name, date, and code.";return}
    const ok=makeCode(name,id,date).replace("-","")===code;
    out.className="verdict "+(ok?"ok":"bad");
    out.textContent=ok?"Valid. This code matches "+name.trim()+" for "+lic(id).name+" on "+prettyDate(date)+".":"No match. Check the spelling of the name and the date, or have the student retake the test in front of you.";
  }}
}

$("#tabStudent").onclick=()=>go({view:"home"});
$("#tabDirector").onclick=()=>go({view:"director"});

/* Remember name/block on this device */
(function(){
  const s=store.get("rbl_student",{});
  if(s.name)$("#studentName").value=s.name;
  if(s.block)$("#studentBlock").value=s.block;
  const save=()=>{store.set("rbl_student",student());if(current.view==="home")render()};
  $("#studentName").oninput=save;$("#studentBlock").onchange=save;
})();

render();
</script>
